<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
            font-weight: 500;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            transform: translateY(-2px);
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .joke-category {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 10px;
            font-weight: 600;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😄 Joke Generator</h1>
        
        <div class="joke-box">
            <div class="joke-text" id="jokeText">Click "Get Joke" to start laughing!</div>
        </div>

        <div class="joke-category" id="jokeCategory"></div>

        <div class="button-group">
            <button class="btn-primary" onclick="getJoke()">Get Joke</button>
            <button class="btn-secondary" onclick="getRandomCategory()">Random Category</button>
            <button class="btn-secondary" onclick="copyJoke()">Copy Joke</button>
        </div>

        <div class="footer">
            <p>Powered by <a href="https://jokeapi.dev" style="color: #667eea; text-decoration: none;" target="_blank">JokeAPI</a></p>
        </div>
    </div>

    <script>
        const jokeText = document.getElementById('jokeText');
        const jokeCategory = document.getElementById('jokeCategory');
        let currentJoke = '';

        // Available categories
        const categories = ['general', 'knock-knock', 'programming', 'misc'];

        async function getJoke(category = 'any') {
            jokeText.textContent = 'Loading...';
            jokeText.classList.add('loading');
            jokeCategory.textContent = '';

            try {
                const url = `https://v2.jokeapi.dev/joke/${category}?format=json`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                if (data.error) {
                    jokeText.textContent = 'Oops! Could not find a joke. Try again!';
                    jokeText.classList.add('error');
                    jokeCategory.textContent = '';
                } else {
                    jokeText.classList.remove('loading', 'error');
                    
                    // Handle both single-line and two-part jokes
                    if (data.type === 'single') {
                        currentJoke = data.joke;
                        jokeText.textContent = data.joke;
                    } else {
                        currentJoke = `${data.setup}\n\n${data.delivery}`;
                        jokeText.innerHTML = `${data.setup}<br><br><strong>${data.delivery}</strong>`;
                    }

                    // Display category
                    jokeCategory.textContent = `Category: ${data.category.toUpperCase()}`;
                }
            } catch (error) {
                jokeText.classList.remove('loading');
                jokeText.classList.add('error');
                jokeText.textContent = 'Error fetching joke. Please check your internet connection and try again.';
                jokeCategory.textContent = '';
                console.error('Error:', error);
            }
        }

        function getRandomCategory() {
            const randomCategory = categories[Math.floor(Math.random() * categories.length)];
            getJoke(randomCategory);
        }

        function copyJoke() {
            if (currentJoke) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    alert('Joke copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy:', err);
                });
            } else {
                alert('No joke to copy! Get a joke first.');
            }
        }

        // Load a joke on page load
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
